name: Build and Publish miniasm

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build smoke-test image
        run: docker build -t picotainers-local/miniasm:smoke .

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm picotainers-local/miniasm:smoke -h > help.txt 2>&1 || true
          grep -Ei 'Usage|Options|miniasm' help.txt

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: docker.io/picotainers/miniasm:latest

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
